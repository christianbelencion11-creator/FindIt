<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=390, initial-scale=1.0" />
  <title>IRemember — Lo-Fi Wireframe: Login</title>
  <link rel="stylesheet" href="wireframe.css" />
</head>
<body>

  <!--
    Figma: html.to.design @ 390px, Light
    Screen: Sign In
    Ref: LoginRegisterScreens.kt + AuthShell.kt
  -->
  <div class="screen">
    <span class="screen-label">Login</span>

    <header class="header-zone">
      <div class="header-branding">
        <div>
          <div class="brand-title">IRemember</div>
          <div class="brand-slogan">Never lose track again</div>
        </div>
        <div class="placeholder-box mascot-box">Mascot<br />84×84</div>
      </div>
    </header>

    <main class="auth-body">

      <h1 class="page-title">Sign in</h1>
      <div class="title-accent" aria-hidden="true"></div>
      <p class="page-subtitle">Welcome back to IRemember</p>

      <div class="wf-field">Email</div>

      <div class="wf-field wf-field--password">
        <span>Password</span>
        <span class="wf-field-icon">eye</span>
      </div>

      <a href="#" class="wf-link">Forgot password?</a>

      <button class="wf-btn" type="button">Sign In</button>

      <p class="wf-divider">or continue with</p>

      <div class="social-row">
        <button class="wf-btn-social" type="button">
          <span class="social-icon">G</span>
          Gmail
        </button>
        <button class="wf-btn-social" type="button">
          <span class="social-icon">f</span>
          Facebook
        </button>
      </div>

      <a href="#" class="footer-link">Don't have an account? Create one</a>

    </main>

    <div class="system-nav" aria-hidden="true"></div>
  </div>

</body>
</html>
