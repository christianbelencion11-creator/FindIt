<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=390, initial-scale=1.0" />
  <title>FindIt — Sign In</title>
  <!-- Roboto = Android system font -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="findit-login.css" />
</head>
<body>

  <!--
    Figma import settings (html.to.design):
      Viewport: 390 px  (mobile — uncheck 1920, check 390)
      Theme:    Light
    Frame size: 390 × 844 px

    Mascot: copy findit_character.png into assets/ folder
  -->
  <div class="screen">

    <header class="header">
      <div class="status-bar" aria-hidden="true">
        <span>1:36</span>
        <span class="status-icons">
          <span>●●●●</span>
          <span>WiFi</span>
          <span>86%</span>
        </span>
      </div>

      <svg class="header-wave" viewBox="0 0 390 184" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <defs>
          <linearGradient id="headerGrad" x1="0" y1="0" x2="390" y2="184" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#064E3B"/>
            <stop offset="100%" stop-color="#22C55E"/>
          </linearGradient>
        </defs>
        <path fill="url(#headerGrad)" d="M0,0 L390,0 L390,147.2 C304.2,180.3 218.4,154.6 187.2,136.2 C117,106.7 78,143.5 0,128.8 Z"/>
        <circle cx="58" cy="40" r="36" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
        <circle cx="128" cy="55" r="46" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
        <circle cx="198" cy="40" r="36" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
        <circle cx="268" cy="55" r="46" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
      </svg>

      <div class="header-branding">
        <div class="brand-text">
          <h1>FindIt</h1>
          <p>Never lose track again</p>
        </div>
        <img class="brand-mascot" src="assets/findit_character.png" alt="FindIt mascot" />
      </div>
    </header>

    <main class="content">

      <h2 class="page-title">Sign in</h2>
      <div class="title-accent" aria-hidden="true"></div>
      <p class="page-subtitle">Welcome back to FindIt</p>

      <div class="md-field">
        <input type="email" id="email" placeholder=" " autocomplete="email" />
        <label for="email">Email</label>
      </div>

      <div class="md-field md-field--password">
        <input type="password" id="password" placeholder=" " autocomplete="current-password" />
        <label for="password">Password</label>
        <button class="toggle-password" type="button" aria-label="Show password">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
          </svg>
        </button>
      </div>

      <a href="#" class="forgot-link">Forgot password?</a>

      <button class="btn-primary" type="button">Sign In</button>

      <p class="divider-text">or continue with</p>

      <div class="social-row">
        <button class="btn-social" type="button">
          <img src="assets/ic_google.svg" alt="" width="24" height="24" />
          Gmail
        </button>
        <button class="btn-social" type="button">
          <img src="assets/ic_facebook.svg" alt="" width="24" height="24" />
          Facebook
        </button>
      </div>

      <div class="footer-link">
        <a href="#">Don't have an account? Create one</a>
      </div>

    </main>

    <div class="nav-bar" aria-hidden="true"></div>

  </div>

</body>
</html>
